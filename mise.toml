[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
go = "1.27.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.2"
gotestsum = "1.13.0"
hk = "2.3.1"
jq = "1.8.2"
pinact = "5.0.0"
rumdl = "0.2.77"
taplo = "0.10.0"
typos = "1.50.3"
yamlfmt = "0.21.0"
yamllint = "1.38.0"

[tasks.golangci-build]
description = "Build the project linter with module plugins"
sources = [".custom-gcl.yml", "mise.toml"]
outputs = ["bin/godelta-golangci-lint"]
run = "golangci-lint custom"

[tasks.check]
description = "Verify formatting, lint, config, module tidiness and applicable tests without changing source files"
depends = ["golangci-build"]
run = "hk check --all --check --no-stage"

[tasks.fix]
description = "Apply formatting and available lint/module fixes, then run remaining checks; do not stage files"
depends = ["golangci-build"]
run = "hk fix --all --fix --no-stage"

[tasks.test]
description = "Run all Go tests with the race detector"
run = "gotestsum -- -race -p 2 -parallel 4 -timeout 5m ./..."

[tasks.goreleaser]
description = "Build local snapshot archives without publishing"
run = "goreleaser release --snapshot --clean --parallelism 2"

[tasks.tag]
description = "Create and push a release tag (e.g. mise run tag v0.1.0)"
usage = 'arg "<version>" help="Version to tag, e.g. v0.1.0"'
run = 'git tag -a "${usage_version?}" -m "${usage_version?}" && git push origin "${usage_version?}"'

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"
