name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Restore project linter
        id: linter-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bin/godelta-golangci-lint
          key: linter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'mise.toml') }}
      - name: Mark restored linter fresh
        if: steps.linter-cache.outputs.cache-hit == 'true'
        run: touch bin/godelta-golangci-lint
      - run: mise run check
